<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cắt Video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="header-title">Trình Cắt Video (chạy trên trình duyệt)</h1>

  <main class="app-container">
    <!-- Bảng điều khiển (trái) -->
    <section class="panel-left">
      <div class="form-group">
        <label for="uploader">1. Chọn video từ máy tính</label>
        <input type="file" id="uploader" accept="video/*">
        <p id="fileInfo" class="hint"></p>
      </div>

      <div id="editorControls" class="editor-controls" hidden>
        <div class="shortcuts">
          <strong>Phím tắt:</strong><br>
          <kbd>Space</kbd> Phát/Dừng &nbsp;·&nbsp;
          <kbd>←</kbd> <kbd>→</kbd> Tua 0.1s (giữ <kbd>Shift</kbd> = 1s)<br>
          <kbd>I</kbd> Đặt điểm <b>bắt đầu</b> &nbsp;·&nbsp;
          <kbd>O</kbd> Đặt điểm <b>kết thúc</b>
        </div>

        <div class="form-group">
          <label for="startInput">2. Thời gian bắt đầu (giây)</label>
          <div class="time-control">
            <input type="range" id="startSlider" min="0" value="0" step="0.01">
            <input type="number" id="startInput" min="0" value="0" step="0.01">
            <button type="button" class="small" id="setStartBtn" title="Lấy vị trí hiện tại (I)">Lấy</button>
          </div>

          <label for="endInput">3. Thời gian kết thúc (giây)</label>
          <div class="time-control">
            <input type="range" id="endSlider" min="0" value="0" step="0.01">
            <input type="number" id="endInput" min="0" value="0" step="0.01">
            <button type="button" class="small" id="setEndBtn" title="Lấy vị trí hiện tại (O)">Lấy</button>
          </div>

          <p id="durationInfo" class="hint"></p>
          <button type="button" class="secondary" id="previewBtn">▶ Xem trước đoạn cắt</button>
        </div>

        <div class="form-group">
          <label for="mode">4. Chế độ cắt</label>
          <select id="mode">
            <option value="fast">Cắt nhanh (lossless, giữ nguyên chất lượng)</option>
            <option value="precise">Cắt chính xác (mã hóa lại, chậm hơn)</option>
          </select>
          <p id="modeHint" class="hint"></p>
        </div>

        <button type="button" id="cutBtn">✂️ Thực Hiện Cắt Video</button>
        <div id="statusBox" class="status" role="status" aria-live="polite"></div>
        <a id="downloadLink" class="download-btn" hidden>⬇️ Lưu video đã cắt</a>
      </div>
    </section>

    <!-- Trình phát video (phải) -->
    <section class="panel-right">
      <video id="videoPlayer" controls></video>
    </section>
  </main>

  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
